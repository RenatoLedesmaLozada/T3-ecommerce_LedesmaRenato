server.port=8080

# BASE DE DATOS (PostgreSQL en la Nube - Render)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SPRING SECURITY & JWT STATELESS
jwt.secret.key=EstaEsUnaClaveSuperSecretaYLoSuficientementeLargaParaCumplirConJJWT256Bits!!
jwt.expiration.ms=86400000

# CORS (Permitiendo peticiones generales o de producción)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}